# =============================================================================
# Sumeru — runtime configuration (INI: key = value under [options])
# =============================================================================
# Comments start with # or ; . For path keys (addons_path, assets_path, templates_path,
# sumeru_home, logo_path, brand_css, log_file), relative values are resolved from the INI
# file’s directory (the folder containing this file), except when only sumeru_home is unset
# and core/base fall back to the process current working directory.
#
# Cheat sheet (from sumeru repo root):
#   make run
#   go run ./cmd/sumeru -- -c sumeru.conf -i sales --stop-after-init
#   go run ./cmd/sumeru -- -c sumeru.conf -u sales -p 9090
#
# --- [options] keys (reference) ---
#
# REQUIRED
#   db_host           PostgreSQL host
#   db_port           PostgreSQL port
#   db_user           DB user
#   db_password       DB password
#   db_name           Database name (override per run: -d / --database)
#   http_port         HTTP listen port (override: -p / --http-port)
#   addons_path       Comma-separated addon roots (subdirs with manifest.json).
#                     core/base (platform addons) is always prepended first;
#                     later segments override duplicate technical module names.
#                     Relative segments are resolved from this INI file’s directory.
#
# OPTIONAL — database
#   db_sslmode        PostgreSQL sslmode (e.g. disable, require). Default: disable
#
# OPTIONAL — static UI / templates (relative to this INI’s directory unless absolute)
#   assets_path       Static assets root (CSS/JS). Default: core/engine/assets (under sumeru_home if set, else cwd)
#   templates_path    HTML shell templates. Default: core/engine/templates (same rule)
#
# OPTIONAL — branding
#   logo_path         Image file; served at /static/app-logo (.svg, .png, .jpg, .webp)
#   company_display_name   Header chip text (else first res.company when installed)
#   user_display_name      Header label (else first res.users when installed)
#   brand_css         Extra CSS file path; linked as /static/brand.css after view CSS
#
# OPTIONAL — workspace / split checkout
#   sumeru_home       If set, core/base (platform addons) is loaded from this directory
#                     (the standard sumeru repo). Relative values are resolved from the INI file’s
#                     directory. When set, default assets_path / templates_path (if omitted) are
#                     under this tree. Use when running with -c pointing at a config outside the
#                     sumeru repo (e.g. sumeru_custom_addons/sumeru.conf).
#
#   log_file          If set, append standard log output to this file (and stderr).
#                     Parent directories are created. Path is absolutized like other paths.
#
# =============================================================================

[options]

# --- Database (required) ---
db_host = localhost
db_port = 5432
db_user = postgres
db_password = postgres
db_name = sumeru
db_sslmode = disable

# --- HTTP (required) ---
http_port = 8090

# --- Addons (required) ---
# Example extra root: addons,/opt/sumeru/extra-addons
addons_path = addons

# --- Paths (optional) ---
# assets_path = core/engine/assets
# templates_path = core/engine/templates

# --- Branding (optional) ---
# logo_path = /path/to/logo.svg
# company_display_name = ACME Inc
# user_display_name = Administrator
# brand_css = /path/to/extra.css

# --- Logging (optional) ---
# log_file = ./logs/sumeru.log
