<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Sumeru</title>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 2rem; width: 100%; max-width: 380px; box-shadow: 0 25px 50px -12px rgba(0,0,0,.45); }
        h1 { font-size: 1.25rem; margin: 0 0 0.5rem; font-weight: 600; }
        p { color: #94a3b8; font-size: 0.875rem; margin: 0 0 1.25rem; }
        label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: .05em; color: #94a3b8; margin-bottom: 0.35rem; }
        input { width: 100%; box-sizing: border-box; padding: 0.6rem 0.75rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; margin-bottom: 1rem; }
        input:focus { outline: 2px solid #6366f1; border-color: transparent; }
        button { width: 100%; padding: 0.65rem; border: none; border-radius: 6px; background: #6366f1; color: white; font-weight: 600; cursor: pointer; }
        button:hover { background: #4f46e5; }
        .err { background: #7f1d1d; color: #fecaca; padding: 0.65rem; border-radius: 6px; font-size: 0.875rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
<div class="card">
    <h1>Sign in</h1>
    <p>Use your Sumeru account. Default bootstrap user is <strong>admin</strong> / <strong>admin</strong> until changed.</p>
    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
    <form method="post" action="/web/login">
        <input type="hidden" name="next" value="{{.Next}}"/>
        <label for="login">Login</label>
        <input id="login" name="login" type="text" autocomplete="username" required autofocus/>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required/>
        <button type="submit">Sign in</button>
    </form>
</div>
</body>
</html>
